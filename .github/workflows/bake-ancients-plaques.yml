name: Bake Ancients plaque textures
on:
  push:
    branches: [ancients-integrated-plaques]
permissions:
  contents: write
jobs:
  bake:
    if: github.event.head_commit.message == 'Build integrated Ancients plaque textures'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==11.3.0
      - run: base64 -d plaque-plan.json.gz.b64 | gzip -d > /tmp/plaque-plan.json
      - run: python bake_plaques.py /tmp/plaque-plan.json assets/tts/ancients-integrated-plaques --workers 12
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tts/ancients-integrated-plaques
          git commit -m "Publish baked Ancients plaque textures"
          git push origin HEAD:ancients-integrated-plaques
