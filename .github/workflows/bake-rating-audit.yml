name: Build rating audit assets
on:
  push:
    branches: [ancients-rating-audit]
permissions:
  contents: write
jobs:
  bake:
    if: github.event.head_commit.message == 'Build Ancients rating audit assets'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==11.3.0
      - run: python bake_ratings.py rating-plan.json assets/tts/ancients-rating-audit --workers 8
      - run: python zama_art.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tts/ancients-rating-audit
          git commit -m "Publish Ancients rating and Zama briefing textures"
          git push origin HEAD:ancients-rating-audit
